apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # 🔴 DO NOT hardcode secrets. Use external-secrets operator or SealedSecrets.
  # Use kubectl create secret generic backend-secrets --from-env-file=.env.prod
  SECRET_KEY: "" # placeholder - set via external-secrets
  POSTGRES_USER: "" # placeholder - set via external-secrets
  POSTGRES_PASSWORD: "" # placeholder - set via external-secrets
  DATABASE_URL: "" # placeholder - set via external-secrets
  REDIS_URL: "" # placeholder - set via external-secrets
