apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # 🔴 CHANGE ALL VALUES BELOW before deploying to production
  SECRET_KEY: "replace-with-long-random-secret-key"
  POSTGRES_USER: "conductor"
  POSTGRES_PASSWORD: "replace-with-strong-password"
  DATABASE_URL: "postgres://conductor:replace-with-strong-password@postgres-service:5432/learninghub_prod"
  REDIS_URL: "redis://redis-service:6379/0"
