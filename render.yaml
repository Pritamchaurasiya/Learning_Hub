services:
  - type: web
    name: learninghub-django-api-staging
    runtime: docker
    repo: https://github.com/Pritamchaurasiya/Learning_Hub
    branch: feat/django-primary-backend-foundation
    plan: free
    region: oregon
    autoDeployTrigger: off
    dockerContext: learninghub/django_backend
    dockerfilePath: learninghub/django_backend/Dockerfile
    dockerCommand: >-
      /bin/sh -c 'python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec daphne -b 0.0.0.0 -p ${PORT:-8000}
      learninghub_server.asgi:application'
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: learninghub_server.settings
      - key: ALLOWED_HOSTS
        fromService:
          name: learninghub-django-api-staging
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://learninghub-385.pages.dev
      - key: CORS_ALLOWED_ORIGINS
        value: https://learninghub-385.pages.dev
      - key: ALLOW_IN_MEMORY_BACKENDS
        value: "true"
