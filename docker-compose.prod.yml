version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learninghub_prod}
      POSTGRES_USER: ${POSTGRES_USER:-learninghub_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learninghub_secure_pass_2026}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learninghub_admin} -d ${POSTGRES_DB:-learninghub_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learninghub_prod_network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-learninghub_redis_pass_2026}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-learninghub_redis_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - learninghub_prod_network

  express_backend:
    build:
      context: ./learninghub/backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-learninghub_admin}:${POSTGRES_PASSWORD:-learninghub_secure_pass_2026}@db:5432/${POSTGRES_DB:-learninghub_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-learninghub_redis_pass_2026}@redis:6379/0
      REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-lh-jwt-prod-signing-key-super-secure-32charslong!}
      CSRF_SECRET: ${CSRF_SECRET:-lh-csrf-prod-signing-key-super-secure-64charslong-production-token!}
      ADMIN_SECRET: ${ADMIN_SECRET:-lh-admin-prod-secret-32charslong!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      learninghub_prod_network:
        aliases:
          - express_backend

  backend:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-lh-prod-secret-key-super-secure-32charslong!}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-lh-jwt-prod-signing-key-super-secure-32charslong!}
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_admin}:${POSTGRES_PASSWORD:-learninghub_secure_pass_2026}@db:5432/${POSTGRES_DB:-learninghub_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-learninghub_redis_pass_2026}@redis:6379/0
      ALLOWED_HOSTS: "backend,frontend,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:80,http://frontend"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      learninghub_prod_network:
        aliases:
          - backend
          - django_backend

  celery_worker:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    restart: always
    command: celery -A config worker -l INFO -Q default,ai_computation
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-lh-prod-secret-key-super-secure-32charslong!}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-lh-jwt-prod-signing-key-super-secure-32charslong!}
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_admin}:${POSTGRES_PASSWORD:-learninghub_secure_pass_2026}@db:5432/${POSTGRES_DB:-learninghub_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-learninghub_redis_pass_2026}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - learninghub_prod_network

  celery_beat:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    restart: always
    command: celery -A config beat -l INFO
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-lh-prod-secret-key-super-secure-32charslong!}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-lh-jwt-prod-signing-key-super-secure-32charslong!}
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_admin}:${POSTGRES_PASSWORD:-learninghub_secure_pass_2026}@db:5432/${POSTGRES_DB:-learninghub_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-learninghub_redis_pass_2026}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - learninghub_prod_network

  frontend:
    build:
      context: ./learninghub
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - express_backend
    networks:
      - learninghub_prod_network

  # Observability & Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - learninghub_prod_network

  grafana:
    image: grafana/grafana:11.0.0
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - learninghub_prod_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  grafana_data:

networks:
  learninghub_prod_network:
    driver: bridge
