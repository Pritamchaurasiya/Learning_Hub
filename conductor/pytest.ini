[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = venv .venv .env .git .vs test_logs _test_logs .mypy_cache .pytest_cache build dist learning_hub_sdk
addopts = --ignore-glob=*.txt -p no:schemathesis -p no:metadata --ds=config.settings.test
asyncio_mode = auto
pythonpath = . learning_hub_sdk
testpaths = apps tests
django_find_project = false
