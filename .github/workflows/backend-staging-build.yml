name: LearningHub Express Staging Build

on:
  pull_request:
    branches: [main]
    paths:
      - "learninghub/backend/**"
      - "learninghub/package.json"
      - "learninghub/package-lock.json"
      - ".github/workflows/backend-staging-build.yml"

permissions:
  contents: write

concurrency:
  group: express-staging-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Sync Node lockfiles, Prisma generate & TypeScript build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/backend-staging-prisma-drift'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learninghub/backend

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learninghub/backend/package-lock.json

      # Regenerate lockfiles using the package manifests, then commit only lockfiles to this repair branch.
      # This resolves the verified npm ci drift without changing package.json or touching production data.
      - name: Regenerate frontend and backend lockfiles
        run: |
          npm install --package-lock-only --legacy-peer-deps --prefix ..
          npm install --package-lock-only --legacy-peer-deps

      - name: Commit synchronized lockfiles on repair branch
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../package-lock.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already synchronized."
          else
            git commit -m "fix(ci): synchronize Node lockfiles"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Verify clean install for frontend
        run: npm ci --legacy-peer-deps --prefix ..

      - name: Verify clean install for backend
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build
