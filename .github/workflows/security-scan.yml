name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          
      - name: Install dependencies
        run: |
          cd learninghub/backend && npm ci
          cd ../ && npm ci --ignore-scripts
          
      - name: Run npm audit
        run: |
          echo "==> Auditing backend dependencies..."
          cd learninghub/backend && (npm audit --production --audit-level=high || true)
          echo "==> Auditing frontend dependencies..."
          cd ../ && (npm audit --production --audit-level=high || true)
        continue-on-error: true
          
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.82.0
        with:
          path: ./
          base: main
          
      - name: Check Snyk token configuration
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk security scan
        if: steps.snyk-token.outputs.configured == 'true'
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
        continue-on-error: true
          
      - name: Report skipped Snyk scan
        if: steps.snyk-token.outputs.configured != 'true'
        run: echo "::notice::SNYK_TOKEN is not configured; Snyk scan was skipped."

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif
