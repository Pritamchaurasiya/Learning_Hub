name: Production CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: learning_hub
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd conductor
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install pytest pytest-django factory-boy

      - name: Run Backend Tests
        env:
          SECRET_KEY: ci_secret_key_for_testing
          DATABASE_URL: postgres://admin:password@localhost:5432/learning_hub
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd conductor
          python manage.py migrate
          pytest tests/

  frontend-analyze:
    name: Frontend Build, Type Check & Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learninghub
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: learninghub/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5000/api/v1"
          VITE_ENABLE_MOCK_API: "true"

      - name: Run Unit Tests
        run: npm test -- --run

  docker-build:
    needs: [backend-tests, frontend-analyze]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t learning_hub_backend:latest ./conductor
