name: One-time backend lockfile refresh

on:
  push:
    branches:
      - fix/ci-cd-stabilization
    paths:
      - learninghub/backend/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-cd-stabilization
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate backend lockfile
        working-directory: learninghub/backend
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learninghub/backend/package-lock.json
          git rm .github/workflows/refresh-backend-lock.yml
          git commit -m "chore(deps): refresh backend lockfile"
          git push origin HEAD:fix/ci-cd-stabilization
