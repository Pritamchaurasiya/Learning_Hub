name: Postman API Quality Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "postman/collections/**"
      - "postman/environments/**"
      - "docs/POSTMAN_GITHUB_INTEGRATION.md"
      - ".github/workflows/postman-api-tests.yml"
  push:
    branches: [main]
    paths:
      - "postman/collections/**"
      - "postman/environments/**"
      - "docs/POSTMAN_GITHUB_INTEGRATION.md"
      - ".github/workflows/postman-api-tests.yml"

permissions:
  contents: read

concurrency:
  group: postman-api-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collection-validation:
    name: Validate Postman collections and environments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Postman Collection v2.1, assertions, smoke safety and secrets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const suites = [
            {
              label: 'Django DRF',
              collectionPath: 'postman/collections/learninghub-django-api.collection.json',
              environmentPath: 'postman/environments/learninghub-local.environment.json',
              requiredFolders: [
                '00 — Health',
                '01 — Authentication',
                '02 — Learning & Assessment',
                '03 — Security & Access Control'
              ],
              smokeFolders: [
                '00 — Health',
                '02 — Learning & Assessment',
                '03 — Security & Access Control'
              ],
              minimumRequests: 7
            },
            {
              label: 'Express/Node',
              collectionPath: 'postman/collections/learninghub-express-api.collection.json',
              environmentPath: 'postman/environments/learninghub-express-local.environment.json',
              requiredFolders: [
                '00 — Process Health',
                '01 — Public Catalog',
                '02 — Authentication & Security'
              ],
              smokeFolders: [
                '00 — Process Health',
                '01 — Public Catalog',
                '02 — Authentication & Security'
              ],
              minimumRequests: 6
            }
          ];

          function collectRequests(items, output = []) {
            for (const item of items || []) {
              if (item.request) output.push(item);
              if (item.item) collectRequests(item.item, output);
            }
            return output;
          }

          for (const suite of suites) {
            const collection = JSON.parse(fs.readFileSync(suite.collectionPath, 'utf8'));
            const environment = JSON.parse(fs.readFileSync(suite.environmentPath, 'utf8'));

            assert.equal(
              collection.info.schema,
              'https://schema.getpostman.com/json/collection/v2.1.0/collection.json',
              `${suite.label}: collection must use Postman Collection v2.1.0`
            );

            const folders = new Map((collection.item || []).map(folder => [folder.name, folder]));
            for (const name of suite.requiredFolders) {
              assert.ok(folders.has(name), `${suite.label}: missing folder ${name}`);
            }

            const allRequests = collectRequests(collection.item);
            assert.ok(
              allRequests.length >= suite.minimumRequests,
              `${suite.label}: expected at least ${suite.minimumRequests} requests, found ${allRequests.length}`
            );

            for (const item of allRequests) {
              assert.ok(item.name, `${suite.label}: every request needs a name`);
              assert.ok(item.request.url, `${suite.label}: missing URL in ${item.name}`);
              assert.ok(item.request.method, `${suite.label}: missing method in ${item.name}`);
              assert.ok(
                (item.event || []).some(event => event.listen === 'test' && event.script?.exec?.length),
                `${suite.label}: missing request assertions in ${item.name}`
              );
            }

            let smokeCount = 0;
            for (const folderName of suite.smokeFolders) {
              const folder = folders.get(folderName);
              const selected = collectRequests(folder.item);
              assert.ok(selected.length > 0, `${suite.label}: smoke folder is empty: ${folderName}`);
              for (const item of selected) {
                assert.equal(
                  item.request.method,
                  'GET',
                  `${suite.label}: CI smoke folders may only contain GET requests: ${item.name}`
                );
                const requestUrl = typeof item.request.url === 'string'
                  ? item.request.url
                  : item.request.url?.raw;
                assert.ok(
                  typeof requestUrl === 'string' && requestUrl.includes('{{baseUrl}}'),
                  `${suite.label}: smoke request must use baseUrl: ${item.name}`
                );
                smokeCount += 1;
              }
            }

            const sensitiveKeys = new Set([
              'password', 'testPassword', 'accessToken', 'refreshToken',
              'apiKey', 'api_key', 'secret', 'clientSecret'
            ]);

            for (const variable of [
              ...(collection.variable || []),
              ...(environment.values || [])
            ]) {
              if (sensitiveKeys.has(variable.key)) {
                assert.equal(
                  variable.value,
                  '',
                  `${suite.label}: exported credential/token must be blank: ${variable.key}`
                );
              }
            }

            console.log(
              `[${suite.label}] validated ${allRequests.length} requests, ${smokeCount} GET-only smoke requests, and blank credential placeholders.`
            );
          }
          NODE

  newman-django-smoke:
    name: Newman — Django DRF live API smoke tests
    needs: collection-validation
    if: ${{ needs.collection-validation.result == 'success' && vars.LEARNINGHUB_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ vars.LEARNINGHUB_API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require HTTPS staging target
        run: |
          case "$API_BASE_URL" in
            https://*) echo "HTTPS Django staging target configured." ;;
            *) echo "LEARNINGHUB_API_BASE_URL must be an HTTPS staging URL." >&2; exit 1 ;;
          esac

      - name: Run safe GET-only Django Postman folders
        run: |
          npx --yes newman@6 run postman/collections/learninghub-django-api.collection.json \
            --env-var "baseUrl=$API_BASE_URL" \
            --folder "00 — Health" \
            --folder "02 — Learning & Assessment" \
            --folder "03 — Security & Access Control" \
            --timeout-request 10000 \
            --reporters cli,junit \
            --reporter-junit-export newman-django-results.xml

      - name: Upload Django Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-django-api-smoke-report
          path: newman-django-results.xml
          if-no-files-found: ignore
          retention-days: 14

  newman-express-smoke:
    name: Newman — Express/Node live API smoke tests
    needs: collection-validation
    if: ${{ needs.collection-validation.result == 'success' && vars.LEARNINGHUB_EXPRESS_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ vars.LEARNINGHUB_EXPRESS_API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require HTTPS staging target
        run: |
          case "$API_BASE_URL" in
            https://*) echo "HTTPS Express staging target configured." ;;
            *) echo "LEARNINGHUB_EXPRESS_API_BASE_URL must be an HTTPS staging URL." >&2; exit 1 ;;
          esac

      - name: Run safe GET-only Express Postman folders
        run: |
          npx --yes newman@6 run postman/collections/learninghub-express-api.collection.json \
            --env-var "baseUrl=$API_BASE_URL" \
            --folder "00 — Process Health" \
            --folder "01 — Public Catalog" \
            --folder "02 — Authentication & Security" \
            --timeout-request 10000 \
            --reporters cli,junit \
            --reporter-junit-export newman-express-results.xml

      - name: Upload Express Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-express-api-smoke-report
          path: newman-express-results.xml
          if-no-files-found: ignore
          retention-days: 14

