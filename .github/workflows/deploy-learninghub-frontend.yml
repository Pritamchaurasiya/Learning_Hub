name: Deploy LearningHub Frontend to Cloudflare Pages

on:
  push:
    branches: [main, develop]
    paths:
      - "learninghub/src/**"
      - "learninghub/public/**"
      - "learninghub/index.html"
      - "learninghub/package.json"
      - "learninghub/package-lock.json"
      - "learninghub/vite.config.*"
      - "learninghub/tsconfig*.json"
      - "learninghub/postcss.config.*"
      - "learninghub/tailwind.config.*"
      - "learninghub/eslint.config.*"
      - "learninghub/playwright.config.*"
      - ".github/workflows/deploy-learninghub-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learninghub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: learninghub/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Warn when backend API is not configured
        if: ${{ !vars.VITE_API_URL }}
        run: echo "::warning::VITE_API_URL is not configured. Static pages can deploy, but API-powered features require a deployed backend URL."

      - name: Build production frontend
        run: npm run build
        env:
          # Use the real deployed API base URL, including its version prefix.
          # The fallback publishes the SPA but does not create an API backend.
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api/v1' }}
          VITE_ENABLE_DEBUG: "false"
          VITE_ENABLE_MOCK_API: "false"
          VITE_BUILD_MODE: production

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ffe3702d3d707669c1a7041264290400"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@latest pages deploy dist --project-name=learninghub --branch="${{ github.ref_name }}"

      - name: Smoke test deployed frontend
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_BRANCH" == "main" ]]; then
            SITE_URL="https://learninghub-385.pages.dev"
          else
            SITE_URL="https://${DEPLOY_BRANCH}.learninghub-385.pages.dev"
          fi

          echo "Checking deployed site: $SITE_URL"
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$SITE_URL/" --output /tmp/learninghub-index.html

          grep -qi 'LearningHub' /tmp/learninghub-index.html
          grep -Eqi 'id="root"' /tmp/learninghub-index.html

          ASSET_PATH="$(grep -oE '/assets/[^" ]+\.js' /tmp/learninghub-index.html | head -n 1 || true)"
          if [[ -z "$ASSET_PATH" ]]; then
            echo "::error::No compiled JavaScript asset reference was found in the deployed HTML."
            exit 1
          fi

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$SITE_URL$ASSET_PATH" --output /dev/null

          echo "Smoke test passed: HTML and a compiled JavaScript asset are reachable."
