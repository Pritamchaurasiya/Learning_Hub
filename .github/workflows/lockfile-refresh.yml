name: Temporary npm lockfile refresh

on:
  pull_request:
    branches: [main]
    paths:
      - 'learninghub/package.json'
      - 'learninghub/backend/package.json'
      - '.github/workflows/lockfile-refresh.yml'

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    name: Regenerate and verify npm lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Regenerate frontend lockfile
        working-directory: learninghub
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify frontend lockfile
        working-directory: learninghub
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate Node backend lockfile
        working-directory: learninghub/backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Node backend lockfile
        working-directory: learninghub/backend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload npm lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: learninghub-npm-lockfiles
          path: |
            learninghub/package-lock.json
            learninghub/backend/package-lock.json
          if-no-files-found: error
          retention-days: 2
