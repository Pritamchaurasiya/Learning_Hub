name: Temporary npm lockfile refresh

on:
  pull_request:
    branches: [main]
    paths:
      - 'learninghub/package.json'
      - 'learninghub/backend/package.json'
      - '.github/workflows/lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    name: Regenerate and verify npm lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Regenerate frontend lockfile
        working-directory: learninghub
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify frontend lockfile
        working-directory: learninghub
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate Node backend lockfile
        working-directory: learninghub/backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Node backend lockfile
        working-directory: learninghub/backend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit verified lockfiles to the PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learninghub/package-lock.json learninghub/backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match package manifests."
          else
            git commit -m "chore: regenerate npm package lockfiles"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
