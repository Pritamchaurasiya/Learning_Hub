name: Temporary Prisma Schema Drift Diagnostic

on:
  push:
    branches:
      - fix/ci-cd-stabilization

permissions:
  contents: read

jobs:
  prisma-drift:
    name: Compute Prisma migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: learninghub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: learninghub/backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate schema drift SQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > /tmp/prisma-schema-drift.sql
          echo "Generated schema drift SQL:"
          wc -l -c /tmp/prisma-schema-drift.sql
          sed -n '1,80p' /tmp/prisma-schema-drift.sql
          echo "Potential destructive statements:"
          grep -Ein 'DROP (TABLE|COLUMN|TYPE|INDEX)|ALTER COLUMN .*DROP NOT NULL|TRUNCATE' /tmp/prisma-schema-drift.sql || true
      - name: Upload schema drift SQL
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema-drift-sql
          path: /tmp/prisma-schema-drift.sql
          if-no-files-found: error
          retention-days: 3
