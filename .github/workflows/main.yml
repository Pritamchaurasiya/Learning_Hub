name: Production Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./conductor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Tests
        env:
          SECRET_KEY: "${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-prod' }}"
          DEBUG: "True"
        run: |
          pytest

  frontend-quality:
    name: Frontend Quality (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learninghub
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: learninghub/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5000/api/v1"
          VITE_ENABLE_MOCK_API: "true"

      - name: Run Tests
        run: npm test -- --run

  infrastructure-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint ./conductor/charts/learning-hub

      - name: Check Snyk token configuration
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Snyk Security Scan
        if: steps.snyk-token.outputs.configured == 'true'
        uses: snyk/actions/python@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Report skipped Snyk scan
        if: steps.snyk-token.outputs.configured != 'true'
        run: echo "::notice::SNYK_TOKEN is not configured; Snyk scan was skipped."
