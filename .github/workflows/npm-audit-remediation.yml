name: Non-breaking npm audit remediation (temporary)

on:
  push:
    branches: [fix/ci-cd-stabilization]

permissions:
  contents: write

jobs:
  remediate:
    name: Apply non-breaking npm fixes and validate lockfiles
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-cd-stabilization
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm CLI (avoid npm 10 Arborist resolver crash)
        run: |
          npm install --global npm@11.21.1
          node --version
          npm --version

      - name: Apply frontend non-breaking audit fixes
        working-directory: learninghub
        shell: bash
        run: |
          set +e
          npm audit fix --no-fund --no-progress
          code=$?
          echo "Frontend npm audit fix exit code: $code"
          echo "FRONTEND_AUDIT_FIX_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Apply backend non-breaking audit fixes
        working-directory: learninghub/backend
        shell: bash
        run: |
          set +e
          npm audit fix --legacy-peer-deps --no-fund --no-progress
          code=$?
          echo "Backend npm audit fix exit code: $code"
          echo "BACKEND_AUDIT_FIX_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Validate frontend clean install
        working-directory: learninghub
        run: npm ci --no-audit --no-fund

      - name: Validate frontend typecheck and production build
        working-directory: learninghub
        env:
          VITE_API_URL: 'http://localhost:5000/api/v1'
          VITE_ENABLE_MOCK_API: 'true'
        run: |
          npx tsc --noEmit
          npm run build

      - name: Validate backend clean install
        working-directory: learninghub/backend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate Prisma and backend TypeScript
        working-directory: learninghub/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DIRECT_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          npx prisma generate
          npx tsc --noEmit

      - name: Report remaining frontend advisories
        working-directory: learninghub
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/frontend-audit.json
          audit_code=$?
          set -e
          node -e "const a=require('/tmp/frontend-audit.json'); console.log(JSON.stringify({auditExit:${audit_code},metadata:a.metadata?.vulnerabilities,advisories:Object.values(a.vulnerabilities||{}).map(v=>({name:v.name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"

      - name: Report remaining backend advisories
        working-directory: learninghub/backend
        shell: bash
        run: |
          set +e
          npm audit --legacy-peer-deps --json > /tmp/backend-audit.json
          audit_code=$?
          set -e
          node -e "const a=require('/tmp/backend-audit.json'); console.log(JSON.stringify({auditExit:${audit_code},metadata:a.metadata?.vulnerabilities,advisories:Object.values(a.vulnerabilities||{}).map(v=>({name:v.name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"

      - name: Commit dependency manifest and lockfile changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learninghub/package.json learninghub/package-lock.json learninghub/backend/package.json learninghub/backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No non-breaking npm dependency changes were generated."
            exit 0
          fi
          git commit -m "chore(deps): apply non-breaking npm security updates"
          git push origin HEAD:fix/ci-cd-stabilization
