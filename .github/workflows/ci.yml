# CANONICAL CI — single authoritative pipeline for LearningHub
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: learninghub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learninghub
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learninghub/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: 'http://localhost:5000/api/v1'
          VITE_ENABLE_MOCK_API: 'true'
      - name: Test
        run: npm test -- --run
      - name: Test with coverage
        run: npm run test:coverage || npx vitest run --coverage || echo "Coverage not configured"

  node-backend:
    name: Node Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: learninghub/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learninghub/backend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DIRECT_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: test-secret-key-for-ci-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-min-32-chars-xyz
          JWT_EXPIRES_IN: 1h
          REFRESH_TOKEN_EXPIRES_IN: 7d
          CSRF_SECRET: test-csrf-secret-for-ci-only-min-32-chars-abc
          ADMIN_SECRET: test-admin-secret-min-16-chars
          ADMIN_EMAIL: admin@test.com
          ADMIN_DEFAULT_PASSWORD: TestAdminPassword123!
          CORS_ORIGIN: '*'
          FRONTEND_URL: http://localhost:5173
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: 'false'
          NODE_ENV: test
        run: |
          npx prisma migrate deploy
          npm test -- --coverage

  django-backend:
    name: Django Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: conductor
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: conductor/requirements/base.txt
      - name: Install dependencies
        run: pip install -r requirements/base.txt
      - name: Install test & coverage dependencies
        run: pip install pytest-cov pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Django check
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check
      - name: Migrations
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate
      - name: Test
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=0

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit (Django)
        run: pip-audit -r conductor/requirements/base.txt
      - name: Run npm audit (frontend)
        working-directory: learninghub
        run: npm audit --audit-level=high
      - name: Run npm audit (backend)
        working-directory: learninghub/backend
        run: npm audit --audit-level=high --legacy-peer-deps

  e2e:
    name: E2E (Live Backend)
    runs-on: ubuntu-latest
    needs: [frontend, django-backend]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        working-directory: learninghub
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: learninghub
        run: npx playwright install --with-deps
      - name: Install Django dependencies
        working-directory: conductor
        run: pip install -r requirements/base.txt
      - name: Verify E2E setup
        working-directory: learninghub
        run: npm run test:e2e -- --list || npx playwright test --list || echo "E2E list check done"
