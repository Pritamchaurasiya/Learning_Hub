# CANONICAL CI — this file (.github/workflows/ci.yml) is the single authoritative pipeline
# (5 jobs: frontend, node-backend, django-backend, security, e2e live-backend).
# The following nested/legacy workflows are DEPRECATED — GitHub ignores them when the
# repo root is windows_app/; do not extend them, extend this file instead:
#   learninghub/.github/workflows/ci.yml    (standalone mirror for learninghub-as-root checkouts)
#   learninghub/.github/workflows/ci-cd.yml (dead: stale paths, no Django coverage, triggers deploy)
#   .github/workflows/learninghub-ci.yml    (orphan: references workers-backend/conductor paths)
# Ports: Vite :3000 locally (vite.config.ts) / :5173 CI live-E2E override, Node :5000, Django :8000.
# See learninghub/docs/ARCHITECTURE.md §8.1 for the canonical port table.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend CI — React + Vite + Vitest + Playwright
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learninghub
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: learninghub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type check
        run: npx tsc --noEmit

      # Hard failure: learninghub/package.json defines "lint" — do not re-add `|| echo`.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: 'http://localhost:5000/api/v1'
          VITE_ENABLE_MOCK_API: 'true'

      - name: Test
        run: npm test -- --run

      - name: Test with coverage
        run: npm run test:coverage || npx vitest run --coverage || echo "Coverage not configured"

  # Node Backend CI — Express + Prisma + Jest
  node-backend:
    name: Node Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: learninghub/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: learninghub/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Soft failure (intentional): learninghub/backend/package.json has NO "lint"
      # script, so `npm run lint` always exits non-zero. Keep `|| echo` until a lint
      # script is added to the backend package — then make this hard.
      - name: Lint
        run: npm run lint || echo "Lint script not configured"

      - name: Test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DIRECT_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: test-secret-key-for-ci-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-min-32-chars-xyz
          JWT_EXPIRES_IN: 1h
          REFRESH_TOKEN_EXPIRES_IN: 7d
          CSRF_SECRET: test-csrf-secret-for-ci-only-min-32-chars-abc
          ADMIN_SECRET: test-admin-secret-min-16-chars
          ADMIN_EMAIL: admin@test.com
          ADMIN_DEFAULT_PASSWORD: TestAdminPassword123!
          CORS_ORIGIN: '*'
          FRONTEND_URL: http://localhost:5173
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: 'false'
          NODE_ENV: test
        run: |
          npx prisma migrate deploy
          npm test -- --coverage

  # Django Backend CI — Django + DRF + Channels + pytest
  django-backend:
    name: Django Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: learninghub/django_backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: learninghub/django_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test & coverage dependencies
        run: pip install pytest-cov pytest-asyncio ruff

      # Hard failure: ruff is installed in the step above — do not re-add `|| echo`.
      - name: Lint
        run: ruff check .

      - name: Django check
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Migrations
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Test
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=0

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (frontend)
        working-directory: learninghub
        run: npm audit --audit-level=high || echo "npm audit found issues"

      - name: Run npm audit (backend)
        working-directory: learninghub/backend
        run: npm audit --audit-level=high || echo "npm audit found issues"

      - name: Run pip-audit (Django)
        uses: pypa/gh-action-pip-audit@v1
        with:
          requirements-file: learninghub/django_backend/requirements.txt

  # E2E Live-Backend — enabled for CI health 80% → 95% (live E2E on every push)
  e2e:
    name: E2E (Live Backend)
    runs-on: ubuntu-latest
    needs: [frontend, django-backend]
    if: always()
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: learninghub/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: learninghub/django_backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: learninghub
        run: npm ci

      - name: Install Playwright browsers
        working-directory: learninghub
        run: npx playwright install --with-deps

      - name: Install Django dependencies
        working-directory: learninghub/django_backend
        run: pip install -r requirements.txt

      - name: Verify E2E setup (list tests)
        working-directory: learninghub
        run: npm run test:e2e -- --list || npx playwright test --list || echo "E2E list check done"

      - name: Start Django backend (live)
        working-directory: learninghub/django_backend
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
          PAYMENT_WEBHOOK_SECRET: test-webhook-secret-for-e2e
        run: |
          python manage.py migrate --no-input
          nohup python manage.py runserver 0.0.0.0:8000 &
          echo "Django live backend started on 8000"

      - name: Start frontend (live, real backend target)
        working-directory: learninghub
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_API_TARGET: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: |
          nohup npm run dev -- --port 5173 --host 0.0.0.0 &
          echo "Frontend dev server starting on 5173"

      - name: Wait for backends health
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost:8000/api/v1/health || echo "Django health check pending"
          curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost:5173 || echo "Frontend health check pending"
          for i in {1..30}; do
            if curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost:8000/api/v1/health && curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost:5173; then
              echo "Backends healthy"
              break
            fi
            echo "Waiting for backends... attempt $i"
            sleep 2
          done
          curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost:8000/api/v1/health || echo "Django health check failed"
          curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost:5173 || echo "Frontend health check failed"

      - name: Run Playwright E2E (live backend)
        working-directory: learninghub
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_TARGET: http://localhost:8000
          VITE_API_URL: http://localhost:8000/api/v1
          CI: 'true'
        run: npx playwright test --reporter=html
