services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-conductor}
      - POSTGRES_USER=${POSTGRES_USER:-conductor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learning_hub_network

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - learning_hub_network

  backend:
    build: ./conductor
    command: gunicorn config.wsgi:application --config gunicorn_config.py
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - learning_hub_network

  daphne:
    build: ./conductor
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - learning_hub_network

  celery_worker:
    build: ./conductor
    command: celery -A config worker -l info
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - learning_hub_network

  celery_beat:
    build: ./conductor
    command: celery -A config beat -l info
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - learning_hub_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - daphne
    networks:
      - learning_hub_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  learning_hub_network:
    driver: bridge
