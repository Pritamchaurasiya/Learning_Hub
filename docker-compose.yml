version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learninghub}
      POSTGRES_USER: ${POSTGRES_USER:-learninghub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learninghub_user} -d ${POSTGRES_DB:-learninghub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learninghub_network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learninghub_network

  backend:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set_SECRET_KEY_in_.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_user}:${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}@db:5432/${POSTGRES_DB:-learninghub}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "backend,frontend,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:80,http://frontend"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      learninghub_network:
        aliases:
          - backend
          - django_backend

  celery_worker:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    restart: always
    command: celery -A config worker -l info -Q default,ai_computation
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set_SECRET_KEY_in_.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_user}:${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}@db:5432/${POSTGRES_DB:-learninghub}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learninghub_network

  celery_beat:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    restart: always
    command: celery -A config beat -l info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set_SECRET_KEY_in_.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_user}:${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}@db:5432/${POSTGRES_DB:-learninghub}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learninghub_network

  express_backend:
    build:
      context: ./learninghub/backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "5000"
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-learninghub_user}:${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}@db:5432/${POSTGRES_DB:-learninghub}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set_JWT_SECRET_in_.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set_JWT_REFRESH_SECRET_in_.env}
      CSRF_SECRET: ${CSRF_SECRET:?Set_CSRF_SECRET_in_.env}
      ADMIN_SECRET: ${ADMIN_SECRET:?Set_ADMIN_SECRET_in_.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@learninghub.prod}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set_ADMIN_DEFAULT_PASSWORD_in_.env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      learninghub_network:
        aliases:
          - express_backend

  frontend:
    build:
      context: ./learninghub
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend
      - express_backend
    networks:
      - learninghub_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  learninghub_network:
    driver: bridge
