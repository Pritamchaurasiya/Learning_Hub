# Production Nginx Load Balancer Configuration

upstream learninghub_backend {
    # Load balancing method
    least_conn;  # Route to server with least connections
    
    # Backend instances
    server backend1:5000 max_fails=3 fail_timeout=30s;
    server backend2:5000 max_fails=3 fail_timeout=30s;
    # Add more as needed: server backend3:5000;
    
    # Health check
    keepalive 32;
}

upstream learninghub_websocket {
    # IP hash for sticky sessions (WebSocket requires same instance)
    ip_hash;
    
    server backend1:5000 max_fails=3 fail_timeout=30s;
    server backend2:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name learninghub.app www.learninghub.app;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learninghub.app www.learninghub.app;
    
    # SSL certificates
    ssl_certificate /etc/nginx/ssl/learninghub.crt;
    ssl_certificate_key /etc/nginx/ssl/learninghub.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Request limits
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Frontend (React SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Never cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # Backend API (load balanced)
    location /api/ {
        proxy_pass http://learninghub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Health check bypass
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    
    # WebSocket (sticky sessions)
    location /socket.io/ {
        proxy_pass http://learninghub_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts (keep alive)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Health check endpoint (no load balancing)
    location /health {
        proxy_pass http://learninghub_backend;
        access_log off;
    }
    
    # Monitoring endpoints (restrict access)
    location /monitoring/ {
        proxy_pass http://learninghub_backend;
        
        # IP allowlist (uncomment in production)
        # allow 10.0.0.0/8;      # Internal network
        # allow 192.168.0.0/16;  # Internal network
        # deny all;
    }
    
    # Block common attack paths
    location ~ /\. {
        deny all;
    }
    
    location ~ ^/(admin|phpmyadmin|wp-admin) {
        deny all;
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Apply rate limiting to API
limit_req zone=api_limit burst=40 nodelay;

# Logging
access_log /var/log/nginx/learninghub_access.log combined;
error_log /var/log/nginx/learninghub_error.log warn;
