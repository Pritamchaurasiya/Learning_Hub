version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-learninghub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD_in_root_.env}
      POSTGRES_DB: ${DB_NAME:-learninghub}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-learninghub} -d ${DB_NAME:-learninghub}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set_REDIS_PASSWORD_in_root_.env}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD}" ping']
      interval: 10s
      timeout: 5s
      retries: 5

  express_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:?Set_DB_PASSWORD_in_root_.env}@db:5432/${DB_NAME:-learninghub}
      - DIRECT_URL=postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:?Set_DB_PASSWORD_in_root_.env}@db:5432/${DB_NAME:-learninghub}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set_REDIS_PASSWORD_in_root_.env}@redis:6379/0
      - REDIS_ENABLED=true
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - JWT_SECRET=${JWT_SECRET:?Set_JWT_SECRET_in_root_.env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set_JWT_REFRESH_SECRET_in_root_.env}
      - CSRF_SECRET=${CSRF_SECRET:?Set_CSRF_SECRET_in_root_.env}
      - ADMIN_SECRET=${ADMIN_SECRET:?Set_ADMIN_SECRET_in_root_.env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@learninghub.prod}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?Set_ADMIN_DEFAULT_PASSWORD_in_root_.env}
    ports:
      - '5000:5000'
    volumes:
      - express_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  django_backend:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=learninghub_server.settings
      - SECRET_KEY=${SECRET_KEY:?Set_DJANGO_SECRET_KEY_in_root_.env}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:?Set_DB_PASSWORD_in_root_.env}@db:5432/${DB_NAME:-learninghub}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set_REDIS_PASSWORD_in_root_.env}@redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - ADMIN_SECRET=${ADMIN_SECRET:?Set_ADMIN_SECRET_in_root_.env}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate && python manage.py seed_data && daphne -b 0.0.0.0 -p 8000 learninghub_server.asgi:application"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      express_backend:
        condition: service_healthy
      django_backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  express_uploads:
