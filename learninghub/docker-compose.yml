version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-learninghub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learninghub_secret}
      POSTGRES_DB: ${DB_NAME:-learninghub}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-learninghub} -d ${DB_NAME:-learninghub}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  express_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:-learninghub_secret}@db:5432/${DB_NAME:-learninghub}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-learninghub_super_secret_jwt_key_2026_prod}
      - CSRF_SECRET=${CSRF_SECRET:-lh-csrf-prod-signing-key-super-secure-64charslong-production-token!}
      - ADMIN_SECRET=${ADMIN_SECRET:-lh-admin-prod-secret-32charslong!}
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  django_backend:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=learninghub_server.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-super-secret-key-learninghub-2026!}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:-learninghub_secret}@db:5432/${DB_NAME:-learninghub}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - ADMIN_SECRET=${ADMIN_SECRET:-test-admin-secret-key-32charslong!!}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate && python manage.py seed_data && daphne -b 0.0.0.0 -p 8000 learninghub_server.asgi:application"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - django_backend
      - express_backend

volumes:
  postgres_data:
  redis_data:
