version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-learninghub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learninghub_secret}
      POSTGRES_DB: ${DB_NAME:-learninghub}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-learninghub} -d ${DB_NAME:-learninghub}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:-learninghub_secret}@db:5432/${DB_NAME:-learninghub}
      - DIRECT_URL=${DIRECT_URL:-postgresql://${DB_USER:-learninghub}:${DB_PASSWORD:-learninghub_secret}@db:5432/${DB_NAME:-learninghub}}
      # Redis Configuration
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      # Server Configuration (changed from 8000 to 5000 to match code default and .env.development)
      - PORT=5000
      - NODE_ENV=production
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-${JWT_SECRET:-your-super-secret-jwt-key}}
      # CORS & Frontend Configuration
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # CSRF Configuration (use a strong 64+ char hex string in production)
      - CSRF_SECRET=${CSRF_SECRET:-change-me-generate-a-secure-csrf-secret-at-least-32-chars-long-please-replace-me}
      # Admin Configuration
      - ADMIN_SECRET=${ADMIN_SECRET:-change-me-generate-a-secure-admin-secret-at-least-16-chars}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@learninghub.com}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-change-me-secure-password-123}
      # External APIs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock-key}
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
