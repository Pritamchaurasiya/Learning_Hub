<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Main Shield & Wing Gradient -->
    <linearGradient id="primary-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Secondary Flare Gradient -->
    <linearGradient id="secondary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="85%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Core Star Glow Gradient -->
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.25" />
    </filter>

    <filter id="neon-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#ambient-glow)" />

  <!-- Outer Protective Hex Ring / Orbital Frame -->
  <path d="M256 48 L440 148 V364 L256 464 L72 364 V148 Z" 
        stroke="url(#primary-grad)" 
        stroke-width="3" 
        stroke-dasharray="16 10" 
        opacity="0.35" 
        fill="none" />

  <!-- Back Left Ascent Wing (The 'L' of Learning) -->
  <g filter="url(#shadow-main)">
    <path d="M120 160 C120 160 170 110 256 160 C256 210 200 320 140 370 C110 395 70 380 70 340 C70 270 120 160 120 160 Z" 
          fill="url(#primary-grad)" />
    
    <!-- Left Wing Specular Edge -->
    <path d="M120 160 C170 110 256 160 256 160 C230 190 190 280 140 370" 
          stroke="url(#glass-specular)" 
          stroke-width="5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8" />
  </g>

  <!-- Back Right Ascent Wing (The 'H' Arc of Hub) -->
  <g filter="url(#shadow-main)">
    <path d="M392 160 C392 160 342 110 256 160 C256 210 312 320 372 370 C402 395 442 380 442 340 C442 270 392 160 392 160 Z" 
          fill="url(#secondary-grad)" />

    <!-- Right Wing Specular Edge -->
    <path d="M392 160 C342 110 256 160 256 160 C282 190 322 280 372 370" 
          stroke="url(#glass-specular)" 
          stroke-width="5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8" />
  </g>

  <!-- Central Interlocking Convergence Nexus (Open Book & AI Node) -->
  <!-- Left Leaf of Knowledge Book -->
  <path d="M256 170 C220 220 160 270 130 330 C125 340 135 352 146 350 C186 342 230 310 256 280 Z" 
        fill="url(#primary-grad)" 
        opacity="0.9" />

  <!-- Right Leaf of Knowledge Book -->
  <path d="M256 170 C292 220 352 270 382 330 C387 340 377 352 366 350 C326 342 282 310 256 280 Z" 
        fill="url(#secondary-grad)" 
        opacity="0.9" />

  <!-- Lower Anchor Diamond Keel -->
  <polygon points="256,280 286,340 256,410 226,340" 
           fill="url(#secondary-grad)" 
           filter="url(#neon-bloom)" />

  <!-- Core Radiant AI Nucleus (Quantum Sparkle / Star of Mastery) -->
  <g filter="url(#neon-bloom)">
    <!-- 4-Point Super Radiant Star -->
    <path d="M256 190 Q256 230 296 230 Q256 230 256 270 Q256 230 216 230 Q256 230 256 190 Z" 
          fill="url(#core-glow)" />

    <!-- Central Diamond Gem Core -->
    <circle cx="256" cy="230" r="14" fill="#FFFFFF" />
    <circle cx="256" cy="230" r="8" fill="#38BDF8" />
  </g>

  <!-- Orbiting Satellites / Quantum Micro Nodes -->
  <circle cx="150" cy="190" r="7" fill="#38BDF8" filter="url(#neon-bloom)" />
  <circle cx="362" cy="190" r="7" fill="#F43F5E" filter="url(#neon-bloom)" />
  <circle cx="256" cy="115" r="9" fill="#A855F7" filter="url(#neon-bloom)" />
</svg>
