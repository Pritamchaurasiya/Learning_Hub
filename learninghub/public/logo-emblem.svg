<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <defs>
    <!-- Filters for Depth & Soft Glow -->
    <filter id="cap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="book-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <!-- Gradients matching the design kit -->
    <!-- 1. Cap Gradients -->
    <linearGradient id="cap-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="cap-rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="tassel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- 2. Star Gradient (Golden Achievement) -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 3. Learner Figure (Growth & Aspiration) -->
    <linearGradient id="learner-head-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="learner-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 4. Left Book Pages (Blue/Cyan Diversity) -->
    <linearGradient id="page-left-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="page-left-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- 5. Right Book Pages (Rising Sun & Purple Gradients) -->
    <linearGradient id="page-right-sun" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <linearGradient id="page-right-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="page-right-lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Ambient Shadow Under Book -->
    <radialGradient id="base-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Under-Book Ground Glow -->
  <ellipse cx="200" cy="305" rx="140" ry="20" fill="url(#base-glow)" />

  <!-- ==================== OPEN BOOK PAGES (BACKGROUND TO FOREGROUND) ==================== -->
  <g filter="url(#book-shadow)">
    <!-- 1. Right Sunburst / Gold Page (Rising Sun Concept) -->
    <path
      d="M200 248 C235 220 285 185 328 170 C336 167 344 172 344 180 C344 196 338 214 322 230 C280 248 238 256 200 258 Z"
      fill="url(#page-right-sun)"
    />

    <!-- 2. Left Lower Blue Page -->
    <path
      d="M200 270 C160 270 100 258 54 236 C46 232 44 222 49 215 C58 202 72 192 90 184 C128 212 168 238 200 248 Z"
      fill="url(#page-left-back)"
    />

    <!-- 3. Left Main Swooping Page (Cyan / Dynamic Learning) -->
    <path
      d="M200 278 C158 274 105 258 64 226 C56 220 54 209 60 201 C68 188 84 176 104 168 C144 200 178 232 200 254 Z"
      fill="url(#page-left-front)"
    />

    <!-- 4. Right Lower Purple Wing -->
    <path
      d="M200 270 C240 270 300 258 346 236 C354 232 356 222 351 215 C342 202 328 192 310 184 C272 212 232 238 200 248 Z"
      fill="url(#page-right-lower)"
    />

    <!-- 5. Right Main Swooping Page (Vibrant Purple / Innovation) -->
    <path
      d="M200 278 C242 274 295 258 336 226 C344 220 346 209 340 201 C332 188 316 176 296 168 C256 200 222 232 200 254 Z"
      fill="url(#page-right-purple)"
    />

    <!-- Book Spine Apex Center Indicator -->
    <path
      d="M196 276 Q200 273 204 276 L202 284 Q200 286 198 284 Z"
      fill="#1E293B"
      opacity="0.4"
    />
  </g>

  <!-- ==================== LEARNER FIGURE (GROWTH & ASPIRATION) ==================== -->
  <g>
    <!-- Learner Arms and Torso (Dynamic V-Shape Reaching Up) -->
    <path
      d="M200 246 
         C188 215 168 175 138 144
         C132 138 138 128 146 130
         C164 136 178 152 188 170
         C194 156 206 156 212 170
         C222 152 236 136 254 130
         C262 128 268 138 262 144
         C232 175 212 215 200 246 Z"
      fill="url(#learner-body-grad)"
    />

    <!-- Learner Head (Knowledge / Mind) -->
    <circle
      cx="200"
      cy="138"
      r="16"
      fill="url(#learner-head-grad)"
      filter="drop-shadow(0 2px 4px rgba(2,132,199,0.3))"
    />
  </g>

  <!-- ==================== GRADUATION CAP (SUCCESS & EDUCATION) ==================== -->
  <g filter="url(#cap-shadow)">
    <!-- Cap Under Skull / Crown Band -->
    <path
      d="M164 96 C164 116 178 128 200 128 C222 128 236 116 236 96 C226 102 214 106 200 106 C186 106 174 102 164 96 Z"
      fill="url(#cap-rim-grad)"
    />

    <!-- Cap Top Diamond (Mortarboard Plane) -->
    <path
      d="M200 52 L268 84 L200 106 L132 84 Z"
      fill="url(#cap-top-grad)"
    />

    <!-- Cap Diamond Bevel Top Highlight -->
    <path
      d="M200 52 L268 84 L200 88 L132 84 Z"
      fill="#FFFFFF"
      opacity="0.18"
    />

    <!-- Center Button on Mortarboard -->
    <ellipse cx="200" cy="84" rx="5" ry="3.5" fill="#1E3A8A" />

    <!-- Tassel Ribbon & Hanging Fringe -->
    <path
      d="M200 84 Q238 88 252 98 Q260 106 260 118"
      stroke="url(#tassel-grad)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Tassel Node & End -->
    <circle cx="260" cy="120" r="3" fill="#0284C7" />
    <path
      d="M258 122 L256 138 L264 138 L262 122 Z"
      fill="url(#tassel-grad)"
    />
  </g>

  <!-- ==================== 4-POINT STAR (EXCELLENCE & ACHIEVEMENT) ==================== -->
  <g filter="url(#star-glow)">
    <path
      d="M300 56 
         Q300 78 318 78 
         Q300 78 300 100 
         Q300 78 282 78 
         Q300 78 300 56 Z"
      fill="url(#star-grad)"
    />
    <!-- Center Sparkle Core -->
    <circle cx="300" cy="78" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
