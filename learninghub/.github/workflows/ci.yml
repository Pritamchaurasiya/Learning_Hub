# NOTE: Canonical CI is at repo root: .github/workflows/ci.yml (working-directory: learninghub/*)
# This file is kept for parity when learninghub/ is used as standalone repo root.
# It mirrors the root CI but uses relative working-directories (., backend, django_backend).
# If repo root is windows_app/, GitHub will ignore this file and use the root one.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend CI
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type check
        run: npx tsc --noEmit

      # Hard failure: package.json defines "lint" — do not re-add `|| echo`.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: 'http://localhost:5000/api/v1'
          VITE_ENABLE_MOCK_API: 'true'

      - name: Test
        run: npm test -- --run

      - name: Test with coverage
        run: npm run test:coverage || npx vitest run --coverage || echo "Coverage not configured"

  # Node Backend CI
  node-backend:
    name: Node Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Soft failure (intentional): backend/package.json has NO "lint" script.
      # Keep `|| echo` until a lint script is added there — then make this hard.
      - name: Lint
        run: npm run lint || echo "Lint script not configured"

      - name: Test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DIRECT_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: test-secret-key-for-ci-only-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-min-32-chars-xyz
          JWT_EXPIRES_IN: 1h
          REFRESH_TOKEN_EXPIRES_IN: 7d
          CSRF_SECRET: test-csrf-secret-for-ci-only-min-32-chars-abc
          ADMIN_SECRET: test-admin-secret-min-16-chars
          ADMIN_EMAIL: admin@test.com
          ADMIN_DEFAULT_PASSWORD: TestAdminPassword123!
          CORS_ORIGIN: '*'
          FRONTEND_URL: http://localhost:5173
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: 'false'
          NODE_ENV: test
        run: |
          npx prisma migrate deploy
          npm test -- --coverage

  # Django Backend CI
  django-backend:
    name: Django Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: django_backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: django_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test & coverage dependencies
        run: pip install pytest-cov pytest-asyncio ruff

      # Hard failure: ruff is installed in the step above — do not re-add `|| echo`.
      - name: Lint
        run: ruff check .

      - name: Django check
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Migrations
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Test
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          DJANGO_DEBUG: 'True'
          DEBUG: 'True'
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=0

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (frontend)
        run: npm audit --audit-level=high || echo "npm audit found issues"

      - name: Run npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high || echo "npm audit found issues"

      - name: Run pip-audit (Django)
        uses: pypa/gh-action-pip-audit@v1
        with:
          requirements-file: django_backend/requirements.txt
