<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Master software engineering from fundamentals to cutting-edge technologies. LearningHub offers 70+ courses covering Foundation, Beginner, Intermediate, Advanced, and Expert phases."
    />
    <meta
      name="keywords"
      content="software engineering, learning platform, web development, computer science, programming courses, react, typescript"
    />
    <meta name="author" content="LearningHub Team" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://learninghub.example.com/" />

    <!-- Resource Hints for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.learninghub.example.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.learninghub.example.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://learninghub.example.com/" />
    <meta property="og:title" content="LearningHub - Complete Software Engineering Path" />
    <meta
      property="og:description"
      content="Master software engineering from fundamentals to cutting-edge technologies. 70+ courses across 5 phases."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="LearningHub" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://learninghub.example.com/" />
    <meta property="twitter:title" content="LearningHub - Complete Software Engineering Path" />
    <meta
      property="twitter:description"
      content="Master software engineering from fundamentals to cutting-edge technologies. 70+ courses across 5 phases."
    />
    <meta property="twitter:image" content="/og-image.png" />

    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Prevent FOIT: swap ensures text remains visible during font load */
      @font-face {
        font-family: 'Inter';
        font-display: swap;
      }
      @font-face {
        font-family: 'Fira Code';
        font-display: swap;
      }
    </style>

    <title>LearningHub - Complete Software Engineering Learning Platform</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
