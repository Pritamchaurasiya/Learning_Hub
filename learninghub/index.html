<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Master software engineering from fundamentals to cutting-edge technologies. LearningHub offers 70+ courses covering Foundation, Beginner, Intermediate, Advanced, and Expert phases."
    />
    <meta
      name="keywords"
      content="software engineering, learning platform, web development, computer science, programming courses, react, typescript, DSA practice, mock tests"
    />
    <meta name="author" content="LearningHub Team" />
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />

    <!-- Resource Hints for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-Blocking Google Fonts Loading (Improves LCP) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:title" content="LearningHub - Complete Software Engineering Path" />
    <meta
      property="og:description"
      content="Master software engineering from fundamentals to cutting-edge technologies. 70+ courses across 5 phases."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="LearningHub" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@learninghub_app" />
    <meta name="twitter:url" content="%VITE_APP_URL%/" />
    <meta name="twitter:title" content="LearningHub - Complete Software Engineering Path" />
    <meta
      name="twitter:description"
      content="Master software engineering from fundamentals to cutting-edge technologies. 70+ courses across 5 phases."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>LearningHub - Complete Software Engineering Learning Platform</title>
    <script>
      // Prevents theme flash: apply dark class before React hydrates
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('learninghub-storage') || '{}')
          var theme = stored && stored.theme && stored.theme.mode
          if (
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
